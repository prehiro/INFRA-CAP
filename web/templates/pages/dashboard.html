{{define "dashboard_content"}}
<div class="max-w-6xl mx-auto space-y-6">
  <div class="page-header shrink-0 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <div class="page-icon-badge relative inline-flex items-center justify-center w-11 h-11 shrink-0 rounded-box bg-gradient-to-br from-primary/15 via-primary/8 to-primary/5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="relative w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="9" x="3" y="3" rx="1"/>
          <rect width="7" height="5" x="14" y="3" rx="1"/>
          <rect width="7" height="9" x="14" y="12" rx="1"/>
          <rect width="7" height="5" x="3" y="16" rx="1"/>
        </svg>
        <span class="perm-live-dot perm-live-dot-corner"></span>
      </div>
      <div class="min-w-0">
        <h1 class="text-xl font-bold leading-tight truncate">Dashboard</h1>
        <p class="text-base-content/50 text-xs mt-0.5 truncate">Selamat datang di INFRA-CAP. Ringkasan lisensi akan tampil di sini (Fase 2).</p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    {{range .Cards}}
    <div class="rounded-xl bg-base-100 border border-base-300 shadow-sm p-5 hover:shadow-md hover:border-primary/40 transition-all">
      <div class="text-xs font-medium uppercase tracking-wide text-base-content/50">{{.Label}}</div>
      <div class="text-3xl font-extrabold mt-2 text-primary">{{.Value}}</div>
    </div>
    {{end}}
  </div>

  <div class="rounded-xl bg-base-100 border border-base-300 shadow-sm p-6">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">Expiring Soon</h2>
      <span class="badge badge-outline">Fase 2</span>
    </div>
    <div class="py-10 text-center text-base-content/40 text-sm">
      Daftar lisensi yang mendekati kedaluwarsa akan tampil di sini.
    </div>
  </div>
</div>
{{end}}
