{{define "layout"}}<!DOCTYPE html>
<html lang="id" class="group/html" data-theme="infracap">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — INFRA-CAP</title>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/notes-md.js"></script>

  <script defer src="/static/js/alpine.min.js"></script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('sidebar', () => ({
        collapsed: false,
        mobileOpen: false,
        active: window.location.pathname,
        menu: [
          { href: '/', label: 'Dashboard', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>' },
          { href: '/licenses', label: 'License Manager', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>' },
          { href: '/audit', label: 'Audit Trail', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>' },
          { href: '/notes', label: 'Notes', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>' },
          { href: '/users', label: 'Users', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' },
        ],
        init() {
          this.collapsed = localStorage.getItem('sidebar-collapsed') === 'true'
          this.active = this.menu.map(m => m.href)
            .filter(h => this.active === h || (h !== '/' && this.active.startsWith(h)))
            .sort((a, b) => b.length - a.length)[0] || '/'
        },
        toggle() {
          this.collapsed = !this.collapsed
          localStorage.setItem('sidebar-collapsed', this.collapsed)
        },
      }))

    Alpine.data('datePicker', (name, initial) => ({
      open: false,
      placement: 'top',               // default = top per Hiro's preference
      name,
      selected: initial || '',
      display: initial || '',
      iso: initial ? (() => { const [d,m,y] = initial.split('-'); return '20'+y+'-'+m+'-'+d })() : '',
      view: null,
      get monthLabel() {
        const v = this.view
        const names = ['January','February','March','April','May','June','July','August','September','October','November','December']
        return names[v.month] + ' ' + v.year
      },
      init() {
        // Always seed view with current month (so cells/monthLabel return data
        // even before the user interacts — e.g. when the filter bar re-renders
        // via HTMX swap with a value).
        if (!this.view) this.view = this.monthOf(new Date())
        if (this.iso) this.view = this.monthOf(new Date(this.iso))
      },
      // smart position: default = 'top'. Only flip to 'bottom' if there's clearly
      // not enough room above (field is jammed against the very top of the viewport).
      computePlacement() {
        const wrap = this.$el;
        if (!wrap) { this.placement = 'top'; return; }
        const rect = wrap.getBoundingClientRect();
        const POPUP_H = 300;
        const spaceAbove = rect.top;
        const spaceBelow = window.innerHeight - rect.bottom;
        if (spaceAbove < POPUP_H && spaceBelow > spaceAbove + 80) {
          this.placement = 'bottom';
        } else {
          this.placement = 'top';
        }
      },
      toggle() {
        if (this.open) { this.open = false; return; }
        this.computePlacement();
        this.open = true;
      },
      onType(val) {
        this.display = val;
        const m = String(val).match(/^(\d{1,2})-(\d{1,2})-(\d{2,4})$/);
        if (!m) return;
        let d = +m[1], mo = +m[2] - 1, y = +m[3];
        if (y < 100) y += 2000;
        const date = new Date(y, mo, d);
        if (date.getDate() !== d || date.getMonth() !== mo || date.getFullYear() !== y) return;
        const p = n => String(n).padStart(2, '0');
        const iso = y + '-' + p(mo + 1) + '-' + p(d);
        this.selected = iso;
        this.iso = iso;
        this.view = this.monthOf(date);
      },
      toDisplay(iso) {
        if (!iso) return '';
        const [y, m, d] = iso.split('-');
        return d + '-' + m + '-' + y.slice(2);
      },
      monthOf(d) { return { year: d.getFullYear(), month: d.getMonth() } },
      toISO(d) {
        const p = n => String(n).padStart(2, '0')
        return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
      },
      prevMonth() {
        let { year, month } = this.view
        month--; if (month < 0) { month = 11; year-- }
        this.view = { year, month }
      },
      nextMonth() {
        let { year, month } = this.view
        month++; if (month > 11) { month = 0; year++ }
        this.view = { year, month }
      },
      get cells() {
        const { year, month } = this.view
        const first = new Date(year, month, 1)
        const start = first.getDay()
        const daysIn = new Date(year, month+1, 0).getDate()
        const prevDays = new Date(year, month, 0).getDate()
        const cells = []
        for (let i = start-1; i >= 0; i--)
          cells.push({ key: 'p'+i, day: prevDays-i, inMonth: false })
        for (let d = 1; d <= daysIn; d++) {
          const p = n => String(n).padStart(2,'0')
          const iso = year+'-'+p(month+1)+'-'+p(d)
          cells.push({ key: 'c'+d, day: d, inMonth: true, iso,
                       selected: iso === this.selected })
        }
        let need = 42 - cells.length
        for (let d = 1; cells.length < 42 && d <= need; d++)
          cells.push({ key: 'n'+d, day: d, inMonth: false })
        return cells
      },
      pick(cell) {
        if (!cell.inMonth) return
        this.selected = cell.iso
        this.iso = cell.iso
        this.display = this.toDisplay(cell.iso)
        this.open = false
        const f = this.$el.closest('form'); if (f) f.dispatchEvent(new CustomEvent('dp-changed', { bubbles: true }));
      },
      clear() {
        this.selected=''; this.display=''; this.iso=''; this.open=false;
        const f = this.$el.closest('form'); if (f) f.dispatchEvent(new CustomEvent('dp-changed', { bubbles: true }));
      },
      today() {
        const t = this.toISO(new Date())
        this.selected = t; this.iso = t
        this.display = this.toDisplay(t)
        this.view = this.monthOf(new Date())
        this.open = false
        const f = this.$el.closest('form'); if (f) f.dispatchEvent(new CustomEvent('dp-changed', { bubbles: true }));
      },
    }))

      // dpField: datepicker for forms (modal + fallback page). Third arg = disabled guard.
      // Hybrid input: user can either type DD-MM-YY manually or click the calendar icon
      // to open the popover. Default placement is 'top' (popover above the field) — the
      // license modal is already vertically centered, and 'top' is what Hiro wants.
      // The computePlacement() check flips to 'bottom' only if the field is so close
      // to the top of the viewport that there isn't room above.
      Alpine.data('dpField', (name, initial, disabled = false) => ({
        open: false,
        placement: 'top',              // default = top (above field) per Hiro's preference
        name,
        selected: initial || '',
        display: initial || '',
        iso: initial ? (() => { const [d,m,y] = initial.split('-'); return '20'+y+'-'+m+'-'+d })() : '',
        view: null,
        computePlacement() {
          if (disabled) return;
          const wrap = this.$el;
          if (!wrap) { this.placement = 'top'; return; }
          const rect = wrap.getBoundingClientRect();
          const POPUP_H = 300;
          const spaceAbove = rect.top;
          const spaceBelow = window.innerHeight - rect.bottom;
          if (spaceAbove < POPUP_H && spaceBelow > spaceAbove + 80) {
            this.placement = 'bottom';
          } else {
            this.placement = 'top';
          }
          // Debug log so Hiro can verify in DevTools console which placement was chosen.
          console.log('[dpField', name, '] placement=', this.placement,
                      'rect.top=', rect.top, 'rect.bottom=', rect.bottom,
                      'spaceAbove=', spaceAbove, 'spaceBelow=', spaceBelow);
        },
        toggle() {
          if (disabled) return;
          if (this.open) { this.open = false; return; }
          this.computePlacement();
          this.open = true;
          this.$nextTick(() => {
            const i = this.$el.querySelector('input.dp-input');
            if (i) i.focus();
          });
        },
        // parse user-typed text (DD-MM-YY or DD-MM-YYYY). Accepts partial input —
        // returns without updating iso if the format is wrong, so the user can
        // keep typing. Two-digit year is treated as 20YY.
        onType(val) {
          this.display = val;
          const m = String(val).match(/^(\d{1,2})-(\d{1,2})-(\d{2,4})$/);
          if (!m) return;
          let d = +m[1], mo = +m[2] - 1, y = +m[3];
          if (y < 100) y += 2000;
          const date = new Date(y, mo, d);
          // reject overflow dates (e.g. 31-02-26 → JS shifts to March)
          if (date.getDate() !== d || date.getMonth() !== mo || date.getFullYear() !== y) return;
          const p = n => String(n).padStart(2, '0');
          const iso = y + '-' + p(mo + 1) + '-' + p(d);
          this.selected = iso;
          this.iso = iso;
          this.view = { y, m: mo };
        },
        // format an iso string back to the visible DD-MM-YY form
        toDisplay(iso) {
          if (!iso) return '';
          const [y, m, d] = iso.split('-');
          return d + '-' + m + '-' + y.slice(2);
        },
        get monthLabel() {
          const v = this.view
          const names = ['January','February','March','April','May','June','July','August','September','October','November','December']
          if (!v) return ''
          return names[v.m] + ' ' + v.y
        },
        get cells() {
          const v = this.view
          if (!v) return []
          const first = new Date(v.y, v.m, 1)
          const startDow = first.getDay()
          const daysInMonth = new Date(v.y, v.m + 1, 0).getDate()
          const out = []
          for (let k = 0; k < startDow; k++) out.push({ key: 'p'+k, day: '', inMonth: false, iso: '' })
          for (let d = 1; d <= daysInMonth; d++) {
            const mm = String(v.m + 1).padStart(2, '0'), dd = String(d).padStart(2, '0')
            out.push({ key: 'd'+d, day: d, inMonth: true, iso: v.y+'-'+mm+'-'+dd })
          }
          return out
        },
        init() {
          // Always start with a valid view (current month) so the calendar
          // renders even when no value is set yet. Without this, cells/monthLabel
          // return empty for a brand-new field.
          if (!this.view) {
            const n = new Date()
            this.view = { y: n.getFullYear(), m: n.getMonth() }
          }
          if (this.iso) {
            const [y, m] = this.iso.split('-').map(Number)
            this.view = { y, m: m - 1 }
          }
        },
        prevMonth() {
          let v = this.view || (() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() } })()
          v = { y: v.m === 0 ? v.y - 1 : v.y, m: v.m === 0 ? 11 : v.m - 1 }
          this.view = v
        },
        nextMonth() {
          let v = this.view || (() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() } })()
          v = { y: v.m === 11 ? v.y + 1 : v.y, m: v.m === 11 ? 0 : v.m + 1 }
          this.view = v
        },
        pick(cell) {
          if (!cell.inMonth) return
          this.selected = cell.iso
          this.iso = cell.iso
          this.display = this.toDisplay(cell.iso)
          this.open = false
        },
        clear() {
          this.selected = ''
          this.display = ''
          this.iso = ''
          this.open = false
        },
        today() {
          const n = new Date()
          this.pick({ inMonth: true, iso: n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0') })
        }
      }))
  })
  </script>
  <style>
    [x-cloak] { display: none !important; }

    /* DaisyUI v5 sets overflow via CSS vars on :root which causes
       scroll flicker — override with direct values + !important. */
    html, :root { overflow-x: hidden !important; overflow-y: auto !important; scrollbar-gutter: stable !important; }
    body { overflow-x: hidden !important; }
    /* Kill DaisyUI scroll-driven animation that toggles scrollbar-gutter */
    @keyframes set-page-has-scroll { from, to { --page-has-scroll: ; } }

    /* ===== Nexus-style layout ===== */
    .layout-sidebar {
      width: var(--layout-sidebar-width);
      min-width: var(--layout-sidebar-width);
      background: var(--layout-sidebar-background);
      max-height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      position: relative;
      border-inline-end: 1px solid var(--color-base-200);
      transition-property: margin, width, min-width;
      transition-duration: .3s;
      transition-timing-function: cubic-bezier(0.34,1.56,0.64,1); /* spring bounce */
    }
    /* collapsed (desktop): sidebar narrows to icon rail.
       body.sidebar-collapsed is set by Alpine (:class binding). */
    @media (min-width: 64rem) {
      body.sidebar-collapsed .layout-sidebar { width: 68px; min-width: 68px; }
      body.sidebar-collapsed .layout-sidebar .sidebar-label { opacity: 0; }
    }
    /* label/icon micro-transitions */
    .sidebar-label { transition: opacity .2s ease; }
    .layout-content-col {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-width: 0;
    }
    .layout-topbar {
      background: var(--layout-topbar-background);
      min-height: calc(var(--spacing) * 16);
      max-height: calc(var(--spacing) * 16);
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--spacing) * 3);
      padding-inline: calc(var(--spacing) * 3);
      border-bottom: 1px solid var(--color-base-200);
    }
    .layout-content {
      padding: calc(var(--spacing) * 4);
      flex-grow: 1;
    }
    @media (min-width: 48rem) {
      .layout-content { padding: calc(var(--spacing) * 6); }
    }

    /* mobile: fixed drawer + backdrop */
    @media (max-width: 63.98rem) {
      .layout-sidebar {
        position: fixed;
        inset-block: 0;
        left: 0;
        z-index: 500;
        margin-inline-start: calc(var(--layout-sidebar-width) * -1);
      }
      .mobile-open .layout-sidebar { margin-inline-start: 0; }
      .mobile-open .layout-backdrop {
        position: fixed;
        inset: 0;
        z-index: 499;
        background-color: color-mix(in oklab, var(--color-base-content) 25%, transparent);
      }
    }
  </style>
</head>
<body class="bg-base-200 text-base-content" x-data="sidebar()" x-init="init()"
      hx-indicator="#global-loader"
      x-bind:class="{ 'sidebar-collapsed': collapsed, 'mobile-open': mobileOpen }">

  <div class="flex w-full overflow-hidden">

    <!-- ============ SIDEBAR ============ -->
    <aside id="layout-sidebar" class="layout-sidebar">
      <!-- brand -->
      <div class="flex items-center h-16 px-4 shrink-0 overflow-hidden"
           :class="collapsed ? 'justify-center lg:justify-center' : ''">
        <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-content" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        </div>
        <span class="ml-3 font-bold tracking-wide whitespace-nowrap text-lg sidebar-label"
              x-show="!collapsed" x-cloak>INFRA-CAP</span>
      </div>

      <!-- nav -->
      <nav class="flex-1 py-3 px-3 space-y-1 overflow-y-auto overflow-x-hidden">
        <template x-for="item in menu" :key="item.href">
          <a :href="item.href" :title="collapsed ? item.label : undefined"
             class="flex items-center rounded-box px-3 py-2.5 text-sm font-medium cursor-pointer transition-colors"
             :class="active === item.href
                ? 'bg-primary text-primary-content'
                : 'text-base-content/70 hover:bg-base-200 hover:text-base-content'"
             @click="mobileOpen = false">
            <span class="shrink-0 w-5 h-5" x-html="item.icon"></span>
            <span class="ml-3 whitespace-nowrap sidebar-label" x-show="!collapsed" x-cloak x-text="item.label"></span>
          </a>
        </template>
      </nav>

      <!-- footer -->
      <div class="p-4 border-t border-base-200 text-xs text-base-content/40 whitespace-nowrap overflow-hidden"
           x-show="!collapsed" x-cloak>INFRA-CAP v0.1</div>
    </aside>

    <!-- mobile backdrop -->
    <div class="layout-backdrop hidden" @click="mobileOpen=false"></div>

    <!-- ============ CONTENT COLUMN ============ -->
    <div class="layout-content-col">

      <!-- topbar -->
      <div id="layout-topbar" class="layout-topbar">
        <div class="flex items-center gap-2">
          <!-- desktop collapse toggle -->
          <button class="btn btn-square btn-ghost btn-sm hidden lg:inline-flex"
                  aria-label="Toggle sidebar" @click="toggle()">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <!-- mobile open toggle -->
          <button class="btn btn-square btn-ghost btn-sm inline-flex lg:hidden"
                  aria-label="Open menu" @click="mobileOpen=true">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <!-- search (right next to the toggle) -->
          <div class="relative w-full max-w-md">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="search" placeholder="Search... (Ctrl+K)"
                   class="input input-sm input-bordered w-full pl-9 bg-base-200/60 border-base-300 focus:border-primary focus:outline-none rounded-full"
                   @keydown.escape="$el.blur()">
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- global HTMX loader (Phase 3.A) — sits before the bell, no layout shift.
               hx-indicator="#global-loader" on <body> makes HTMX add .htmx-request
               to this element while any request is in flight. -->
          <div id="global-loader" class="htmx-indicator shrink-0" aria-hidden="true" role="status" title="Loading...">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
          </div>
          <button class="btn btn-square btn-ghost btn-sm relative" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M22 8c0-2.3-.8-4.3-2-6"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/><path d="M2 8c0-2.3.8-4.3 2-6"/></svg>
            <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-error"></span>
          </button>
          {{if .AuthUser}}
          <!-- user dropdown -->
          <div class="dropdown dropdown-end" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
            <button class="btn btn-ghost btn-sm gap-2 px-2" @click="open = !open" aria-label="User menu">
              <div class="avatar avatar-placeholder">
                <div class="w-8 rounded-full bg-primary/15 text-primary text-sm font-semibold uppercase">
                  <span>{{slice .AuthUser.FullName 0 1}}</span>
                </div>
              </div>
              <div class="text-left hidden sm:block leading-tight">
                <div class="text-sm font-semibold">{{.AuthUser.FullName}}</div>
                <div class="text-[11px] text-base-content/50 -mt-0.5">{{.AuthUser.Role}}</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-base-content/40 transition-transform" x-bind:class="open ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dropdown-content mt-2 w-56 rounded-box bg-base-100 border border-base-300 shadow-lg py-2 z-50"
                 x-show="open" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
                 x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0 scale-95">
              <div class="px-4 py-2 border-b border-base-300/60">
                <div class="font-semibold text-sm">{{.AuthUser.FullName}}</div>
                <div class="text-xs text-base-content/50 mt-0.5">{{.AuthUser.Username}} · <span class="uppercase tracking-wide">{{.AuthUser.Role}}</span></div>
              </div>
              <form method="post" action="/logout" class="p-2">
                <button type="submit" class="btn btn-ghost btn-sm w-full justify-start gap-2 text-error hover:bg-error/10">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                  Log out
                </button>
              </form>
            </div>
          </div>
          {{end}}
        </div>
      </div>

      <!-- page content -->
      <main id="layout-content" class="layout-content">
        {{.ContentHTML}}
      </main>
    </div>
  </div>
<script>
  // htmx: attach CSRF header to every request
  document.addEventListener('htmx:configRequest', (e) => {
    const m = document.cookie.match(/(?:^|; )infracap_csrf=([^;]*)/);
    if (m) e.detail.headers['X-CSRF-Token'] = decodeURIComponent(m[1]);
  });
  // close all open datepicker popovers when clicking outside any [x-data] wrapper.
  // Backup for Alpine's @click.outside — we walk the event path manually so that
  // elements added later (or wrappers without @click.outside for any reason) still
  // behave correctly. Each wrapper's Alpine data has `.open` and `.close()` is the
  // setter via setting `open = false` directly.
  document.addEventListener('mousedown', (e) => {
    if (!window.Alpine) return;
    // gather all currently-open datepicker wrappers (dpField for modals,
    // datePicker for the license filter bar)
    const wrappers = document.querySelectorAll('[x-data^="dpField"], [x-data^="datePicker("]');
    wrappers.forEach((el) => {
      // skip the wrapper that contains the click target
      if (el.contains(e.target)) return;
      // try to read Alpine state and close
      try {
        const data = window.Alpine.$data(el);
        if (data && data.open) {
          data.open = false;
        }
      } catch (err) { /* Alpine not initialised yet on this element — ignore */ }
    });
  }, true);
  // close edit/new modal after a successful save + show success toast
  document.addEventListener('htmx:afterRequest', (e) => {
    if (!e.detail.successful) return;
    // HX-Retarget is set on the RESPONSE, read it from the xhr
    const xhr = e.detail.xhr;
    const rt = xhr && xhr.getResponseHeader ? xhr.getResponseHeader('HX-Retarget') : null;
    if (!rt || (!rt.includes('license-results') && !rt.includes('user-results') && !rt.includes('notes-results'))) return;
    const modal = document.querySelector('#modal-container > div');
    if (!modal) return;
    // error responses re-render the modal WITH an alert — don't close those
    if (modal && modal.querySelector('.alert-error')) return;
    let closed = false;
    if (window.Alpine && modal) {
      const data = window.Alpine.$data(modal);
      if (data && typeof data.close === 'function') { data.close(); closed = true; }
    }
    if (!closed && modal) modal.remove();          // hard fallback
    // Only show the success toast if a modal was actually closed
    // (i.e. the request originated from the create/edit modal). The
    // toggle-active action also sets HX-Retarget=#user-results but no
    // modal is involved, so we don't want a celebratory toast for that.
    if (modal) window.__showSavedToast();
  });

  // ===== Phase 3.B: global error toast =====
  // Track the most recent HTMX request so the toast's Retry button can replay
  // it (path + verb + target + swap style). We skip the request that fetches
  // the modal itself, because retrying that would just re-open the same modal.
  document.addEventListener('htmx:beforeRequest', (e) => {
    const d = e.detail;
    // ignore if a retry is already in flight (so we don't clobber the new request)
    if (d && d.elt && d.elt.getAttribute && d.elt.getAttribute('data-retrying') === '1') {
      d.elt.removeAttribute('data-retrying');
      return;
    }
    window.__lastHtmxRequest = {
      path: d.path,
      verb: d.verb,
      target: d.target ? d.target.id || '' : '',
      swap: d.swapInfo ? d.swapInfo.swapStyle : 'innerHTML',
    };
  });

  // Listen for failure events. HTMX fires:
  //   htmx:responseError — server returned 4xx/5xx (non-2xx, non-304)
  //   htmx:sendError     — XHR send failed (network down, DNS, CORS)
  //   htmx:timeout       — XHR hit the configured timeout
  // The save-success listener above ALREADY closes modals on success; this is
  // the inverse path for failures — show a red toast, no modal close.
  function __showErrorToast(message, retryable) {
    // remove any prior error toast (or success toast) so they don't stack
    const prior = document.getElementById('error-toast');
    if (prior) prior.remove();
    const savePrior = document.getElementById('save-toast');
    if (savePrior) savePrior.remove();

    const t = document.createElement('div');
    t.id = 'error-toast';
    t.style.cssText = 'position:fixed;top:1.25rem;left:50%;transform:translateX(-50%) translateY(-150%);z-index:999;transition:transform .45s cubic-bezier(0.34,1.56,0.64,1),opacity .3s;opacity:0;';
    const retryBtn = retryable
      ? '<button id="error-toast-retry" type="button" style="display:inline-flex;align-items:center;gap:.3rem;margin-left:.25rem;padding:.25rem .55rem;border-radius:.5rem;background:rgba(255,255,255,.18);color:#fff;font-size:.75rem;font-weight:600;border:1px solid rgba(255,255,255,.25);cursor:pointer;transition:background .15s ease"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Retry</button>'
      : '';
    t.innerHTML = '<div style="display:flex;align-items:center;gap:.6rem;padding:.65rem 1.1rem;border-radius:.75rem;background:#b91c1c;color:#fff;font-size:.8125rem;font-weight:600;box-shadow:0 8px 24px -6px rgba(185,28,28,.5)">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>'
      + '<span style="flex:1">' + message + '</span>'
      + retryBtn
      + '<button type="button" id="error-toast-dismiss" aria-label="Dismiss" style="display:inline-flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;margin-left:.25rem;border-radius:.375rem;background:transparent;color:rgba(255,255,255,.85);border:none;cursor:pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>'
      + '</div>';
    document.body.appendChild(t);

    // wire up retry & dismiss
    const dismiss = () => {
      t.style.transform = 'translateX(-50%) translateY(-150%)';
      t.style.opacity = '0';
      setTimeout(() => t.remove(), 500);
    };
    const dismissBtn = t.querySelector('#error-toast-dismiss');
    if (dismissBtn) dismissBtn.addEventListener('click', dismiss);
    const retryBtnEl = t.querySelector('#error-toast-retry');
    if (retryBtnEl) {
      retryBtnEl.addEventListener('click', () => {
        const r = window.__lastHtmxRequest;
        if (!r || !r.path) { dismiss(); return; }
        // mark the source element so the beforeRequest listener knows this
        // is a retry and doesn't overwrite __lastHtmxRequest mid-flight
        const src = document.querySelector('[hx-target="#' + r.target + '"]')
                 || document.querySelector('[hx-get="' + r.path + '"]')
                 || document.querySelector('[hx-post="' + r.path + '"]');
        if (src) src.setAttribute('data-retrying', '1');
        dismiss();
        // re-issue the same request. CSRF header is added automatically
        // by the configRequest listener above.
        try {
          htmx.ajax(r.verb, r.path, {
            target: r.target ? '#' + r.target : undefined,
            swap: r.swap,
          });
        } catch (err) {
          // fallback: full reload of the page
          window.location.reload();
        }
      });
      retryBtnEl.addEventListener('mouseenter', (ev) => { ev.currentTarget.style.background = 'rgba(255,255,255,.28)'; });
      retryBtnEl.addEventListener('mouseleave', (ev) => { ev.currentTarget.style.background = 'rgba(255,255,255,.18)'; });
    }

    // slide in
    requestAnimationFrame(() => {
      t.style.transform = 'translateX(-50%) translateY(0)';
      t.style.opacity = '1';
    });
    // auto-dismiss after 6s (longer than save toast — user may want to retry)
    setTimeout(dismiss, 6000);
  }

  // 5xx / 4xx response — show toast with retry, BUT skip when the failure
  // was already handled inside a modal (the modal re-renders with alert-error
  // and the close-loop listener above keeps it open). Detection: if the
  // request's target is the modal-container, the modal already shows the error.
  document.addEventListener('htmx:responseError', (e) => {
    const d = e.detail;
    const tgt = d && d.target ? d.target.id : '';
    if (tgt === 'modal-container') return;  // modal handled it
    const status = d && d.xhr ? d.xhr.status : 0;
    let msg = 'Request failed';
    if (status === 0) msg = 'No response from server';
    else if (status >= 500) msg = 'Server error (' + status + ')';
    else if (status === 404) msg = 'Not found';
    else if (status === 403) msg = 'Forbidden';
    else if (status === 401) msg = 'Session expired';
    else msg = 'Request failed (' + status + ')';
    __showErrorToast(msg, true);
  });
  // network failure (XHR send error, e.g. server down / DNS)
  document.addEventListener('htmx:sendError', () => {
    __showErrorToast('Network error — could not reach server', true);
  });
  // XHR timeout
  document.addEventListener('htmx:timeout', () => {
    __showErrorToast('Request timed out', true);
  });

  window.__showSavedToast = function() {
    let t = document.getElementById('save-toast');
    if (t) t.remove();
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;top:1.25rem;left:50%;transform:translateX(-50%) translateY(-150%);z-index:999;transition:transform .45s cubic-bezier(0.34,1.56,0.64,1),opacity .3s;opacity:0;';
    t.innerHTML = '<div style="display:flex;align-items:center;gap:.6rem;padding:.65rem 1.1rem;border-radius:.75rem;background:#15803d;color:#fff;font-size:.8125rem;font-weight:600;box-shadow:0 8px 24px -6px rgba(21,128,61,.5)">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
      + 'Data saved successfully</div>';
    document.body.appendChild(t);
    requestAnimationFrame(() => {
      t.style.transform = 'translateX(-50%) translateY(0)';
      t.style.opacity = '1';
    });
    setTimeout(() => {
      t.style.transform = 'translateX(-50%) translateY(-150%)';
      t.style.opacity = '0';
      setTimeout(() => t.remove(), 500);
    }, 2600);
  };
  // Select a status chip: keep filter state in the live DOM so the search box (and dates)
  // combine with it. Updates the hidden status field, syncs chip active styling, then refetches.
  window.selectStatus = function(status) {
    // keep the chips Alpine state authoritative so active styling is always correct
    const chipsDiv = document.getElementById('status-chips');
    if (chipsDiv) { try { Alpine.$data(chipsDiv).status = status; } catch(e){} }
    const form = document.querySelector('form[hx-get="/licenses"]');
    if (form) {
      const hid = form.querySelector('input[type="hidden"][name="status"]');
      if (hid) hid.value = status;
      // trigger live filter (uses current search + dates + this status)
      form.dispatchEvent(new Event('input', { bubbles: true }));
    }
    htmx.ajax('GET', '/licenses' + (status ? ('?status=' + encodeURIComponent(status)) : ''),
              { target: '#license-results', swap: 'outerHTML' });
  };
  // Master reset: clear the search input + both date pickers + status, then refetch all.
  window.clearAllFilters = function() {
    // reset the chips Alpine state so "All" shows active (indigo) and others don't
    const chipsDiv = document.getElementById('status-chips');
    if (chipsDiv) { try { Alpine.$data(chipsDiv).status = ''; } catch(e){} }
    // blank the form's hidden status/date fields so no stale filter leaks back via live-search
    const form = document.querySelector('form[hx-get="/licenses"]');
    if (form) {
      form.querySelectorAll('input[type="hidden"][name="status"], input[type="hidden"][name="exp_from"], input[type="hidden"][name="exp_to"]')
          .forEach(function (h) { h.value = ''; });
    }
    const inp = document.getElementById('license-search-input');
    if (inp) {
      inp.value = '';
      // update the search wrapper's hasQ state directly (hides the clear X) WITHOUT
      // dispatching 'input' — dispatching would re-trigger the live-search swap and
      // cause a second table flicker.
      const w = inp.closest('[x-data]');
      if (w) { try { Alpine.$data(w).hasQ = false; } catch(e){} }
    }
    // reset date pickers SILENTLY (do NOT call d.clear(), which dispatches 'dp-changed' and
    // would re-trigger the form's live-search listener -> a second table swap / flicker)
    document.querySelectorAll('[x-data^="datePicker"]').forEach(function (el) {
      const d = Alpine.$data(el);
      if (d) { d.selected = ''; d.display = ''; d.iso = ''; }
    });
    htmx.ajax('GET', '/licenses', { target: '#license-results', swap: 'outerHTML' });
  };
  // copy-to-clipboard with insecure-origin fallback
  window.copyText = function(text, field) {
    const done = () => document.dispatchEvent(new CustomEvent('text-copied', { detail: field || '' }));
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => { __copyFallback(text); done(); });
    } else {
      __copyFallback(text);
      done();
    }
  };
  function __copyFallback(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
</script>
  <script>
  // keep status chips' active state in sync after table swaps (chips live outside swap target)
  document.addEventListener('htmx:afterRequest', function (evt) {
    const el = evt.detail && evt.detail.elt;
    if (!el || !el.classList || !el.classList.contains('status-chip')) return;
    const path = el.getAttribute('hx-get') || '';
    const m = path.match(/[?&]status=([^&]*)/);
    const picked = m ? decodeURIComponent(m[1]) : '';
    document.querySelectorAll('#status-chips .status-chip').forEach(function (c) {
      const cm = (c.getAttribute('hx-get') || '').match(/[?&]status=([^&]*)/);
      const cs = cm ? decodeURIComponent(cm[1]) : '';
      c.classList.toggle('status-chip-active', cs === picked);
    });
  });
  </script>
  <div id="modal-container"></div>
</body>
</html>{{end}}
