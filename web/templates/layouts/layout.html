{{define "layout"}}<!DOCTYPE html>
<html lang="id" data-theme="infracap">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — INFRA-CAP</title>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js"></script>
  <script defer src="/static/js/alpine.min.js"></script>
  <script>
    // sidebar state must be defined BEFORE alpine loads
    document.addEventListener('alpine:init', () => {
      Alpine.data('sidebar', () => ({
        collapsed: false,
        mobileOpen: false,
        active: window.location.pathname,
        menu: [
          { href: '/', label: 'Dashboard', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>' },
          { href: '/licenses', label: 'License Manager', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>' },
          { href: '/audit', label: 'Audit Trail', icon: '<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>' },
        ],
        init() {
          this.collapsed = localStorage.getItem('sidebar-collapsed') === 'true'
          this.active = this.menu.map(m => m.href)
            .filter(h => this.active === h || (h !== '/' && this.active.startsWith(h)))
            .sort((a, b) => b.length - a.length)[0] || '/'
        },
        toggle() {
          this.collapsed = !this.collapsed
          localStorage.setItem('sidebar-collapsed', this.collapsed)
        },
      }))
    })
  </script>
  <style>
    [x-cloak] { display: none !important; }
    /* sidebar transition */
    #app-sidebar { transition: width .25s cubic-bezier(0.34,1.56,0.64,1); }
  </style>
</head>
<body class="bg-base-200 min-h-screen" x-data="sidebar()" x-init="init()">

  <!-- ============ SIDEBAR ============ -->
  <aside id="app-sidebar"
    class="fixed inset-y-0 left-0 z-40 flex flex-col bg-neutral text-neutral-content shadow-lg"
    :class="[collapsed ? 'w-16' : 'w-64', mobileOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">

    <!-- brand -->
    <div class="flex items-center h-16 px-3 border-b border-white/10 shrink-0">
      <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center shrink-0">
        <!-- pure SVG logo: shield/stack -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-primary-content" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
      </div>
      <span class="ml-3 font-bold tracking-wide whitespace-nowrap overflow-hidden" x-show="!collapsed" x-cloak>INFRA-CAP</span>
    </div>

    <!-- nav -->
    <nav class="flex-1 py-4 space-y-1 px-2 overflow-y-auto">
      <template x-for="item in menu" :key="item.href">
        <a :href="item.href"
           class="flex items-center rounded-lg px-3 py-2.5 hover:bg-white/10 transition-colors"
           :class="active === item.href ? 'bg-primary text-primary-content' : ''"
           @click="mobileOpen = false">
          <span class="shrink-0 w-6 h-6" x-html="item.icon"></span>
          <span class="ml-3 whitespace-nowrap overflow-hidden" x-show="!collapsed" x-cloak x-text="item.label"></span>
        </a>
      </template>
    </nav>

    <!-- collapse toggle (desktop only) -->
    <div class="p-2 border-t border-white/10 hidden md:block">
      <button class="btn btn-ghost btn-sm w-full justify-center" @click="toggle()" :title="collapsed ? 'Expand' : 'Collapse'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-transform duration-300" :class="collapsed ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
      </button>
    </div>
  </aside>

  <!-- mobile overlay -->
  <div class="fixed inset-0 bg-black/40 z-30 md:hidden" x-show="mobileOpen" x-cloak @click="mobileOpen=false"></div>

  <!-- ============ CONTENT ============ -->
  <div class="min-h-screen flex flex-col transition-all duration-200" :class="collapsed ? 'md:pl-16' : 'md:pl-64'">
    <!-- topbar (mobile hamburger) -->
    <header class="md:hidden sticky top-0 z-20 h-14 bg-base-100 border-b border-base-300 flex items-center px-4 gap-3">
      <button class="btn btn-ghost btn-sm" @click="mobileOpen=true">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="font-bold">INFRA-CAP</span>
    </header>

    <main class="flex-1 p-6">
      {{template "content" .}}
    </main>
  </div>
</body>
</html>{{end}}
