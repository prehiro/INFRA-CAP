{{define "content"}}
<div class="max-w-6xl mx-auto">
  <div class="card bg-base-100 shadow">
    <div class="card-body">
      <h1 class="card-title text-2xl">Dashboard</h1>
      <p class="text-base-content/60">Selamat datang di INFRA-CAP. Ringkasan lisensi akan tampil di sini (Fase 2).</p>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
        {{range .Cards}}
        <div class="stat bg-base-200 rounded-xl">
          <div class="stat-title text-sm">{{.Label}}</div>
          <div class="stat-value text-2xl text-primary">{{.Value}}</div>
        </div>
        {{end}}
      </div>
    </div>
  </div>
</div>
{{end}}
